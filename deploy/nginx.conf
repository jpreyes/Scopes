server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las propuestas llevan imágenes base64 embebidas en el JSON.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API y panel de PocketBase, mismo origen que la SPA (sin CORS).
    location ~ ^/(api|_)/ {
        proxy_pass http://pb-scopes:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        # /api/realtime es SSE: sin buffering y con timeout largo.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Assets con hash en el nombre: cache agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA sin router: todo lo demás cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
